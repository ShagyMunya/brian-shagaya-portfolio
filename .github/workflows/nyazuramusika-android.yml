name: Build NyazuraMusika Android
on:
  push:
    branches: [main]
    paths: ['projects/nyazuramusika/android/**', '.github/workflows/nyazuramusika-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/nyazuramusika/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Check official Gradle wrapper
        run: echo '81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
      - name: Build APK and run price and contact tests
        run: bash gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NyazuraMusika-Android
          path: projects/nyazuramusika/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
